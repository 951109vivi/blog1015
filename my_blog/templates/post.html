
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }} - 我的部落格</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.8;
        }

        .author {
            color: #777;
        }

        .content {
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <a href="{{ url_for('index') }}">← 回到首頁</a>

    <article>
        <h1>{{ post.title }}</h1>

        <p class="author">
            作者：{{ post.author }}
        </p>

        <hr>

        <div class="content">{{ post.content }}</div>
    </article>
</body>
</html>
