
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的部落格</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f5f5f5;
        }

        .post {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .author {
            color: #777;
        }

        a {
            color: #2878c8;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1>我的部落格</h1>

    {% for post in posts %}
        <div class="post">
            <h2>
                <a href="{{ url_for('show_post', post_id=post.id) }}">
                    {{ post.title }}
                </a>
            </h2>

            <p class="author">
                作者：{{ post.author }}
            </p>

            <p>{{ post.content }}</p>

            <a href="{{ url_for('show_post', post_id=post.id) }}">
                閱讀全文 →
            </a>
        </div>
    {% else %}
        <p>目前沒有任何文章。</p>
    {% endfor %}
</body>
</html>
